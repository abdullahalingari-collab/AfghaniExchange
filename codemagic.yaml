
workflows:
  afghani-exchange:
    name: Afghan Asaar - Android APK
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      flutter: stable

    scripts:
      - name: Clean old build files
        script: flutter clean

      - name: Get Flutter packages
        script: flutter pub get

      - name: Verify app icon
        script: |
          if [ ! -f "assets/app_icon(2)-1.png" ]; then
            echo "ERROR: New app icon not found!"
            exit 1
          fi
          echo "New app icon found successfully."

      - name: Generate new app icons
        script: dart run flutter_launcher_icons -f pubspec.yaml

      - name: Build Android APK
        script: flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
